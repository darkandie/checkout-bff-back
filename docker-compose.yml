services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: checkout
      POSTGRES_USER: checkout
      POSTGRES_PASSWORD: checkout
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkout -d checkout"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    profiles: ["app"]
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/checkout
      DATABASE_USERNAME: checkout
      DATABASE_PASSWORD: checkout
      REDIS_HOST: redis
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
