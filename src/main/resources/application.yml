spring:
  application:
    name: checkout-bff
  threads:
    virtual:
      enabled: true

mocks:
  enabled: ${MOCKS_ENABLED:true}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
