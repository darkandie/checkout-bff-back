spring:
  application:
    name: checkout-bff
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/checkout}
    username: ${DATABASE_USERNAME:checkout}
    password: ${DATABASE_PASSWORD:checkout}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 500ms
      timeout: 1s
  cache:
    type: ${CACHE_TYPE:redis}
    cache-names: products,payment-methods
    redis:
      time-to-live: ${CACHE_TTL:10m}
      key-prefix: "checkout-bff::"
      cache-null-values: false

mocks:
  enabled: ${MOCKS_ENABLED:true}

external-services:
  product-service:
    base-url: ${PRODUCT_SERVICE_URL:http://localhost:${server.port}/mocks/product-service}
    connect-timeout: ${PRODUCT_SERVICE_CONNECT_TIMEOUT:2s}
    read-timeout: ${PRODUCT_SERVICE_READ_TIMEOUT:3s}
  payment-method-service:
    base-url: ${PAYMENT_METHOD_SERVICE_URL:http://localhost:${server.port}/mocks/payment-method-service}
    connect-timeout: ${PAYMENT_METHOD_SERVICE_CONNECT_TIMEOUT:2s}
    read-timeout: ${PAYMENT_METHOD_SERVICE_READ_TIMEOUT:3s}

payment-simulator:
  declined-card-suffix: ${PAYMENT_DECLINED_CARD_SUFFIX:0002}
  pix-merchant-name: ${PIX_MERCHANT_NAME:Checkout Assinaturas}
  pix-merchant-city: ${PIX_MERCHANT_CITY:Belem}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: false
